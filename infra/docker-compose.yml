version: "3.8"

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mlflow-server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: mlflow server --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --default-artifact-root /app/mlruns --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  feature-pipeline:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: python pipeline/features/transforms.py
    depends_on:
      - redpanda
      - redis

  inference-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis

  drift-monitor:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: python monitoring/retrain_trigger/run_swadt_live.py
    depends_on:
      - inference-api

  dashboard:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_BASE_URL: "http://inference-api:8000"
    ports:
      - "8501:8501"
    depends_on:
      - inference-api

volumes:
  pgdata: